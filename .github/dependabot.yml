# Dependabot: paketlar uchun yangilanishlarni o'zi tekshiradi va haftasiga
# bir marta pull request ochadi (xavfsizlik tuzatishlari — darhol). Har bir
# PR'da CI ishlaydi: testlar o'tsa — "Merge" qilish kifoya.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/speaking-coach-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Vite, Vitest va plugin'lar birga yangilansin (bir-biriga bog'liq).
      build-tools:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*", "typescript"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
  # Lint vositalari (alohida papka: typescript-eslint TypeScript 7'ni hali qo'llamaydi).
  - package-ecosystem: npm
    directory: /frontend/speaking-coach-web/lint
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # typescript-eslint hali TypeScript 7'ni qo'llamaydi — lint uchun TS 6 qoladi.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directories:
      - /backend/SpeakingCoach.Domain
      - /backend/SpeakingCoach.Application
      - /backend/SpeakingCoach.Infrastructure
      - /backend/SpeakingCoach.Api
      - /backend/SpeakingCoach.Api.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Loyiha net10.0: .NET 11 paketlari (Microsoft.Extensions.*, EF Core) versiya ziddiyatini keltiradi — bosh versiya yangilanmaydi.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
    groups:
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
