# Har bir push va pull request'da avtomatik tekshiruv (Continuous Integration).
# Natija GitHub'dagi "Actions" bo'limida va README'dagi belgida ko'rinadi.
# Ikkala qism parallel ishlaydi; biri qizil bo'lsa — nimadir buzilgan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Test loyihasi API loyihasiga bog'langan — build ikkalasini ham qiladi.
      - run: dotnet test backend/SpeakingCoach.Api.Tests --configuration Release
      # Ma'lum zaifligi bor NuGet paketlari (bevosita va bilvosita) — bo'lsa, CI qizil.
      - name: Vulnerable NuGet packages
        run: |
          dotnet list backend/SpeakingCoach.Api package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi

  frontend:
    name: Frontend (type check + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/speaking-coach-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/speaking-coach-web/package-lock.json
      # npm ci — package-lock.json'dagi AYNAN o'sha versiyalarni o'rnatadi
      # (npm install'dan farqli, lock faylni o'zgartirmaydi).
      - run: npm ci
      # Ma'lum zaifliklar (yuqori va kritik) — bo'lsa, CI qizil.
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
