name: Idea or feature request
description: Suggest something that would help learners or teachers
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Who is affected (learner, teacher) and what is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
